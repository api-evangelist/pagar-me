                              type: string
                              example: ch_1DaVYVQCds28rOm3
                            code:
                              type: string
                              example: G2X5F99FXX-01
                            gateway_id:
                              type: string
                              example: 1e3a21f7-ad65-4ad0-a68c-3eb37e8115c9
                            amount:
                              type: integer
                              example: 1490
                              default: 0
                            status:
                              type: string
                              example: paid
                            currency:
                              type: string
                              example: BRL
                            payment_method:
                              type: string
                              example: credit_card
                            due_at:
                              type: string
                              example: '2017-04-04T00:00:00Z'
                            paid_at:
                              type: string
                              example: '2017-04-04T15:54:49Z'
                            created_at:
                              type: string
                              example: '2017-04-04T15:54:46Z'
                            updated_at:
                              type: string
                              example: '2017-04-04T15:54:46Z'
