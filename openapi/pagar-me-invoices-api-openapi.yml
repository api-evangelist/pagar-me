paths:
  /invoices:
    get:
      summary: Listar faturas
      description: Este recurso permite listar os descontos associados a uma assinatura. Pode ser utilizados alguns parâmetros como filtro da listagem.
      operationId: listar-faturas-1
      parameters:
      - name: status
        in: query
        description: 'Status das faturas. Valores possíveis: **pending**, **paid**, **canceled**, **scheduled** ou **failed**'
        schema:
          type: string
      - name: customer_id
        in: query
        description: Código do cliente.
        schema:
          type: string
      - name: subscription_id
        in: query
        description: Código da fatura.
        schema:
          type: string
      - name: due_since
        in: query
        description: Data de início do período de vencimento a ser listado.
        schema:
          type: string
          format: date
      - name: due_until
        in: query
        description: Data final do período de vencimento a ser listado.
        schema:
          type: string
          format: date
      - name: created_since
        in: query
        description: Data de início do período de criação a ser listado.
        schema:
          type: string
          format: date
      - name: created_until
        in: query
        description: Data final do período de criação a ser listado.
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: Página atual.
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        description: Quantidade de itens por página.
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
