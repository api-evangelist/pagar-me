                            installments:
                              type: integer
                              example: 1
                              default: 0
                            status:
                              type: string
                              example: active
                            created_at:
                              type: string
                              example: '2017-04-04T15:54:19Z'
                            updated_at:
                              type: string
                              example: '2017-04-04T15:54:19Z'
