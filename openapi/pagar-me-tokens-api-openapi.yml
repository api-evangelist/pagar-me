info:
  title: pagarme-api Tokens API
  version: '5'
servers:
- url: https://api.pagar.me/core/v5
security:
- sec0: []
tags:
- name: Tokens
paths:
  /tokens:
    post:
      summary: Criar Token cartão
      description: ''
      operationId: criar-token-cartão-1
      parameters:
      - name: appId
        in: query
        description: Chave publica da conta.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - card
              properties:
                type:
                  type: string
                  description: Tipo do cartão
                card:
                  type: object
                  description: Informações do cartão a ser tokenizado.
                  required:
                  - number
                  - exp_month
                  - exp_year
                  properties:
                    number:
                      type: string
                      description: Número do cartão. Entre 13 e 19 caracteres
                    holder_name:
                      type: string
                      description: Nome do portador como está impresso no cartão. Máximo de 64 caracteres (Caracteres especiais e números não são aceitos)
                    holder_document:
                      type: string
                      description: CPF ou CNPJ do portador do cartão. Obrigatório caso o tipo do cartão seja voucher (bandeiras VR ou Pluxee).
                    exp_month:
                      type: string
                      description: Mês de validade do cartão. Valor entre 1 e 12 (inclusive)
                    exp_year:
                      type: string
                      description: 'Ano de validade do cartão. Formatos yy ou yyyy. Ex: 23 ou 2023.'
                    cvv:
                      type: string
                      description: Código de segurança do cartão. O campo aceita 4 ou 3 caracteres, variando por bandeira.
                    brand:
                      type: string
                      description: '(Opcional) Bandeira do cartão. Para cartões de crédito, temos como valores possíveis: Elo, Mastercard, Visa, Amex, ou Hipercard. Para voucher, temos como valores possíveis: Alelo, VR ou Pluxee.'
                    label:
                      type: string
                      description: Indica a label do cartão
            examples:
              Request Example:
                value:
                  type: card
                  card:
                    number: '4000000000000010'
                    holder_name: Tony Stark
                    exp_month: 1
                    exp_year: 30
                    cvv: '651'
                    label: Sua bandeira
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"token_zVw7rqvHEPH8XlbE\",\n    \"type\": \"card\",\n    \"created_at\": \"2018-06-18T18:48:58Z\",\n    \"expires_at\": \"2018-06-18T18:49:58Z\",\n    \"card\": {\n        \"last_four_digits\": \"5580\",\n        \"holder_name\": \"Tony Stark\",\n        \"exp_month\": 1,\n        \"exp_year\": 30,\n        \"brand\": \"Visa\",\n        \"label\": \"Sua bandeira\"\n    }\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: token_zVw7rqvHEPH8XlbE
                  type:
                    type: string
                    example: card
                  created_at:
                    type: string
                    example: '2018-06-18T18:48:58Z'
                  expires_at:
                    type: string
                    example: '2018-06-18T18:49:58Z'
                  card:
                    type: object
                    properties:
                      last_four_digits:
                        type: string
                        example: '5580'
                      holder_name:
                        type: string
                        example: Tony Stark
                      exp_month:
                        type: integer
                        example: 1
                        default: 0
                      exp_year:
                        type: integer
                        example: 30
                        default: 0
                      brand:
                        type: string
                        example: Visa
                      label:
                        type: string
                        example: Sua bandeira
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"message\": \"Could not renew card.\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Could not renew card.
      deprecated: false
      security: []
      tags:
      - Tokens
components:
  securitySchemes:
    sec0:
      type: http
      scheme: basic
