      deprecated: false
      x-readme:
        code-samples:
        - language: csharp
          code: "using System.Collections.Generic;\nusing System.Web.Mvc;\nusing MundiAPI.PCL;\nusing MundiAPI.PCL.Models;\n\nnamespace MundipaggTest.Controllers {\n\n    public class HomeController : Controller {\n\n        public ActionResult Index () {\n\n            // Secret key fornecida pela Mundipagg\n            string basicAuthUserName = \"SUA_CHAVE_SECRETA\";\n            // Senha em branco. Passando apenas a secret key\n            string basicAuthPassword = \"\";\n\n            var client = new MundiAPIClient (basicAuthUserName, basicAuthPassword);\n\n            string planId = \"plan_21r4CTG0ux77Qv13\";\n\n            var billinAddress = new CreateAddressRequest {\n                Line1 = \"375, Av. General Justo, Centro\",\n                Line2 = \"8º andar\",\n                ZipCode = \"20021130\",\n                City = \"Rio de Janeiro\",\n                State = \"RJ\",\n                Country = \"BR\"\n            };\n\n            var card = new CreateCardRequest {\n                HolderName = \"Tony Stark\",\n                Number = \"4532464862385322\",\n                ExpMonth = 1,\n                ExpYear = 30,\n                Cvv = \"903\",\n                BillingAddress = billinAddress\n            };\n\n            var discounts = new List<CreateDiscountRequest> {\n                new CreateDiscountRequest {\n                Cycles = 3,\n                Value = 10,\n                DiscountType = \"percentage\"\n                }\n            };\n\n            var metadata = new Dictionary<string, string> ();\n            metadata.Add (\"id\", \"my_subscription_id\");\n\n            var request = new CreateSubscriptionRequest {\n                PlanId = planId,\n                PaymentMethod = \"credit_card\",\n                Currency = \"BRL\",\n                Interval = \"month\",\n                IntervalCount = 3,\n                BillingType = \"prepaid\",\n                Installments = 3,\n                Customer = new CreateCustomerRequest {\n                Name = \"Tony Stark\",\n                Email = \"tonystark@avengers.com\"\n                },\n                Card = card,\n                Discounts = discounts,\n                Metadata = metadata\n            };\n\n            var response = client.Subscriptions.CreateSubscription (request);\n\n            return View ();\n        }\n    }\n}"
          name: SDK C#
        samples-languages:
        - csharp
      tags:
      - Subscriptions
    get:
      summary: Listar assinaturas
      description: Este recurso permite listar as assinaturas. Pode ser utilizados alguns parâmetros como filtro da listagem.
      operationId: listar-assinaturas-1
      parameters:
      - name: status
        in: query
        description: 'Status da assinatura.<br>Valores possíveis: **active**, **canceled** ou **future**'
        schema:
          type: string
      - name: code
        in: query
        description: 'Código da assinatura no sistema da loja. Máx.: 52 caracteres'
        schema:
          type: string
      - name: billing_type
        in: query
        description: 'Tipo de cobrança.<br>Valores possíveis: **prepaid**, **postpaid **ou **exact_day**.'
        schema:
          type: string
      - name: customer_id
        in: query
        description: Código do cliente. [Saiba mais sobre clientes](https://docs.pagar.me/reference/clientes-1).
        schema:
          type: string
      - name: plan_id
        in: query
        description: 'Código do plano.<br>Formato: `plan_XXXXXXXXXXXXXXXX`.'
        schema:
          type: string
      - name: card_id
        in: query
        description: 'Código do cartão.<br>Formato: `card_XXXXXXXXXXXXXXXX`.'
        schema:
          type: string
      - name: next_billing_since
        in: query
        description: Data de início da próxima data de cobrança.
        schema:
          type: string
          format: date
      - name: next_billing_until
        in: query
        description: Data final de próxima data de cobrança.
        schema:
          type: string
          format: date
      - name: created_since
        in: query
        description: Data de início do período de criação a ser listado.
        schema:
          type: string
          format: date
      - name: created_until
        in: query
        description: Data final do período de criação a ser listado.
        schema:
