openapi: 3.2.0
info:
  title: pagarme-api Subscriptions API
  version: '5'
servers:
- url: https://api.pagar.me/core/v5
security:
- sec0: []
tags:
- name: Subscriptions
paths:
  /subscriptions:
    post:
      summary: Criar assinatura de plano
      description: Fornecemos a possibilidade de criação de uma assinatura (`subscription`) a partir de plano (`plan`).
      operationId: criar-assinatura-de-plano-1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - plan_id
              - payment_method
              - customer_id
              - customer
              - card
              properties:
                code:
                  type: string
                  description: 'Código da assinatura no sistema da loja. Máx.: 52 caracteres'
                plan_id:
                  type: string
                  description: 'Código do plano.<br>Formato: `plan_XXXXXXXXXXXXXXXX`'
                payment_method:
                  type: string
                  description: 'Meio de pagamento.<br>Valores possíveis: **credit_card**, **boleto** e **debit_card** .'
                start_at:
                  type: string
                  description: Data de início da assinatura.<br>Se não for informada, a assinatura será iniciada **imediatamente**.
                  format: date
                customer_id:
                  type: string
                  description: Código do cliente.<br>**Obrigatório** caso o `customer` não seja informado. [Saiba mais sobre clientes](https://docs.pagar.me/reference/clientes-1).
                customer:
                  type: object
                  description: Dados do cliente.<br>**Obrigatório** caso o `customer_id` não seja informado. [Saiba mais sobre clientes](https://docs.pagar.me/reference/clientes-1).
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: 'Nome do cliente. Max: 64 caracteres.'
                    type:
                      type: string
                      description: 'Tipo de cliente. Valores possíveis: individual (pessoa física) ou company (pessoa jurídica). Obrigatório, caso o document seja enviado.'
                    email:
                      type: string
                      description: 'E-mail do cliente. Max: 64 caracteres.'
                    code:
                      type: string
                      description: 'Código de referência do cliente no sistema da loja. Max: 52 caracteres.'
                    document:
                      type: string
                      description: 'CPF, CNPJ ou PASSAPORTE do cliente. Max: 16 caracteres para CPF e CNPJ e Max: 50 caracteres para PASSAPORTE.'
                    document_type:
                      type: string
                      description: 'Tipo de documento. Valores possíveis: "CPF", "CNPJ" ou "PASSPORT".'
                    gender:
                      type: string
                      description: 'Sexo do cliente . Valores possíveis: male ou female.'
                    address:
                      type: object
                      description: Endereço do cliente.
                      properties:
                        country:
                          type: string
                          description: País (Código do país no formato ISO 3166-1 alpha-2)(2 digitos)
                        state:
                          type: string
                          description: Estado (Código do estado no formato ISO 3166-2).
                        city:
                          type: string
                          description: Cidade.
                        zip_code:
                          type: string
                          description: Código Postal (CEP) (Apenas numérico).
                        line_1:
                          type: string
                          description: Dados principais do endereço. Neste campo deve ser informado Número, Rua, Bairro, nesta ordem e separados por vírgula.
                        line_2:
                          type: string
                          description: Dados complementares do endereço. Neste campo pode ser informado complemento, referências.
                    phones:
                      type: object
                      description: Telefone residencial do cliente.
                      properties:
                        home_phone:
                          type: object
                          description: Telefone residencial do cliente.
                          properties:
                            country_code:
                              type: string
                              description: Código do País (Apenas numérico).
                            area_code:
                              type: string
                              description: Código da área (Apenas numérico).
                            number:
                              type: string
                              description: Número do telefone (Apenas numérico).
                        mobile_phone:
                          type: object
                          description: Telefone celular do cliente.
                          properties:
                            country_code:
                              type: string
                              description: Código do País (Apenas numérico).
                            area_code:
                              type: string
                              description: Código da área (Apenas numérico).
                            number:
                              type: string
                              description: Número do telefone (Apenas numérico).
                    birthdate:
                      type: string
                      description: Data de nascimento do cliente.
                      format: date
                    metadata:
                      type: string
                      description: Objeto chave/valor utilizado para armazenar informações adicionais sobre o cliente.
                card:
                  type: object
                  description: Cartão que será utilizado na assinatura. <br>**- card_id** é o código do cartão do cliente.<br>**- card_token** é token do cartão gerado pelo checkout transparente. <br> É **obrigatório** o envio de uma dessas identificações, caso o **payment_method** seja credit_card ou debit_card.<br>[Saiba mais sobre cartões](https://docs.pagar.me/reference/cart%C3%B5es-1).
                  required:
                  - number
                  - holder_name
                  - exp_month
                  - exp_year
                  properties:
                    number:
                      type: string
                      description: Número do cartão. Entre 13 e 19 caracteres
                    holder_name:
                      type: string
                      description: Nome do portador como está impresso no cartão. Máximo de 64 caracteres (Caracteres especiais e números não são aceitos)
                    holder_document:
                      type: string
                      description: CPF ou CNPJ do portador do cartão. Obrigatório caso o tipo do cartão seja voucher (bandeiras VR ou Pluxee).
                    exp_month:
                      type: integer
                      description: Mês de validade do cartão. Valor entre 1 e 12 (inclusive)
                      format: int32
                    exp_year:
                      type: integer
                      description: 'Ano de validade do cartão. Formatos yy ou yyyy. Ex: 23 ou 2023.'
                      format: int32
                    cvv:
                      type: string
                      description: Código de segurança do cartão. O campo aceita 4 ou 3 caracteres, variando por bandeira.
                    brand:
                      type: string
                      description: '(Opcional) Bandeira do cartão. Para cartões de crédito, temos como valores possíveis: Elo, Mastercard, Visa, Amex, ou Hipercard. Para voucher, temos como valores possíveis: Alelo, Ticket, VR ou Pluxee.'
                    label:
                      type: string
                      description: Indica a label do cartão
                    billing_address_id:
                      type: string
                      description: 'Código do endereço de cobrança. Max: 36 caracteres.<>Opcional, pode ser utilizado no lugar do billing_address.'
                    billing_address:
                      type: object
                      properties:
                        line_1:
                          type: string
                          description: 'Linha 1 do endereço. (Número, Rua, e Bairro - Nesta ordem e separados por vírgula) Max: 256 caracteres.'
                        line_2:
                          type: string
                          description: 'Linha 2 do endereço. (Complemento - Andar, Sala, Apto). Max: 128 caracteres.'
                        zip_code:
                          type: string
                          description: 'CEP. Max: 16 caracteres.'
                        city:
                          type: string
                          description: 'Cidade. Max: 64 caracteres.'
                        state:
                          type: string
                          description: Código do estado no formato ISO 3166-2.
                        country:
                          type: string
                          description: Código do país no formato ISO 3166-1 alpha-2.
                installments:
                  type: integer
                  description: Quantidade de parcelas.<br>O número de parcelas deverá ser 1 em recorrências.
                  default: 1
                  format: int32
                discounts:
                  type: array
                  description: Descontos.
                  items:
                    properties:
                      cycles:
                        type: string
                        description: Número de vezes que o desconto será aplicado.
                      value:
                        type: string
                        description: Valor do desconto.
                      discount_type:
                        type: string
                        description: 'Tipo do desconto. Valores possíveis: flat ou percentage. Valor padrão: percentage.'
                    type: object
                increments:
                  type: array
                  description: Incrementos
                  items:
                    properties:
                      value:
                        type: integer
                        description: Valor do incremento.
                        format: int32
                      cycles:
                        type: string
                        description: Número de vezes que o incremento será aplicado.
                      increment_type:
                        type: string
                        description: 'Tipo do incremento. Valores possíveis: flat ou percentage. Valor padrão: percentage.'
                    type: object
                boleto_due_days:
                  type: integer
                  description: Dias para expiração do boleto. (Caso não seja passado, será pego um valor padrão das configurações da loja)
                  format: int32
                metadata:
                  type: string
                  description: Objeto chave/valor utilizado para armazenar informações adicionais sobre a assinatura.<br>[Saiba mais sobre metadata](https://docs.pagar.me/reference/metadata-1).
            examples:
              JSON (with credit card):
                value:
                  plan_id: plan_21r4CTG0ux77Qv13
                  payment_method: credit_card
                  boleto_due_days: 5
                  customer:
                    name: Tony Stark
                    email: tonystark@avengers.com
                  card:
                    holder_name: Tony Stark
                    number: '4532464862385322'
                    exp_month: 1
                    exp_year: 30
                    cvv: '903'
                    billing_address:
                      line_1: 375, Av. General Justo, Centro
                      line_2: 8º andar
                      zip_code: '20021130'
                      city: Rio de Janeiro
                      state: RJ
                      country: BR
                  discounts:
                  - cycles: 3
                    value: 10
                    discount_type: percentage
                  increments:
                  - cycles: 2
                    value: 20
                    discount_type: percentage
                  metadata:
                    id: my_subscription_id
              JSON (with boleto):
                value:
                  plan_id: plan_21r4CTG0ux77Qv13
                  customer:
                    name: Tony Stark
                    email: tonystark@avengers.com
                  payment_method: boleto
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                OK (with credit card):
                  value: "{\n    \"id\": \"sub_05jkdIfGYPfN26mI\",\n    \"payment_method\": \"credit_card\",\n    \"currency\": \"BRL\",\n    \"interval\": \"month\",\n    \"interval_count\": 3,\n    \"billing_type\": \"prepaid\",\n    \"boleto_due_days\":5,\n    \"current_cycle\": {\n        \"start_at\": \"2016-07-19T00:00:00Z\",\n        \"end_at\": \"2016-10-18T23:59:59Z\"\n    },\n    \"next_billing_at\": \"2016-10-19T00:00:00Z\",\n    \"installments\": 3,\n    \"customer\": {\n        \"id\": \"cus_017228NmffGbA3d4\",\n        \"name\": \"Luke Skywalker\",\n        \"email\": \"lskywalker@r2d2.com\",\n        \"delinquent\": false,\n        \"created_at\": \"2016-07-12T18:25:40Z\",\n        \"updated_at\": \"2016-07-12T18:25:40Z\",\n    },\n    \"card\": {\n        \"id\": \"card_Mome2meGz4PDNQbX\",\n        \"holder_name\": \"Luke Skywalker\",\n        \"masked_number\": \"453246******5322\",\n        \"exp_month\": 1,\n        \"exp_year\": 30,\n        \"expired\": false,\n        \"status\": \"active\",\n        \"created_at\": \"2016-07-12T18:25:40Z\",\n        \"update_at\": \"2016-07-12T18:25:40Z\",\n        \"billing_address\": {\n            \"id\": \"addr_Mome2meGz4PDNQbX\",\n            \"line_1\": \"375, Av. General Justo, Centro\",\n            \"line_2\": \"8º andar\",\n            \"zip_code\": \"20021130\",\n            \"city\": \"Rio de Janeiro\",\n            \"state\": \"RJ\",\n            \"country\": \"BR\",\n            \"status\": \"active\",\n            \"created_at\": \"2016-07-12T18:25:40Z\",\n            \"updated_at\": \"2016-07-12T18:25:40Z\"\n        }\n    },\n    \"plan\": {\n        \"id\": \"plan_21r4CTG0ux77Qv13\",\n        \"name\": \"Plano Gold\",\n        \"url\": \"/plan_21r4CTG0ux77Qv13/academia/plano-gold\",\n        \"currency\": \"BRL\",\n        \"interval\": \"month\",\n        \"minimum_price\": 10000,\n        \"interval_count\": 3,\n        \"billing_type\": \"prepaid\",\n        \"installments\": 3,\n        \"status\": \"active\",\n        \"created_at\": \"2016-07-12T18:25:40Z\",\n        \"updated_at\": \"2016-07-12T18:25:40Z\",\n        \"metadata\": {\n            \"id\": \"my_plan_id\"\n        }\n    },\n    \"discounts\": [\n        {\n            \"id\": \"si_k2zpBDMsOs0fDfHe\",\n            \"cycles\": 3,\n            \"value\": 10,\n            \"discount_type\": \"percentage\",\n            \"created_at\": \"2016-07-12T18:25:40Z\"\n        }\n    ],\n    \"increments\": [\n        {\n            \"cycles\": 2,\n            \"value\": 20,\n            \"discount_type\": \"percentage\"\n        }\n     ],\n    \"items\": [\n        {\n            \"id\": \"si_B6555Riyq9lj6klS\",\n            \"description\": \"Musculação\",\n            \"quantity\": 1,\n            \"pricing_scheme\": {\n                \"price\": 18990\n            },\n            \"status\": \"active\",\n            \"created_at\": \"2016-07-12T18:25:40Z\",\n            \"updated_at\": \"2016-07-12T18:25:40Z\",\n        },\n        {\n            \"id\": \"si_lFjtC2xYGttulJpn\",\n            \"description\": \"Matrícula\",\n            \"quantity\": 1,\n            \"cycles\": 1,\n            \"pricing_scheme\": {\n                \"price\": 5990\n            },\n            \"status\": \"active\",\n            \"created_at\": \"2016-07-12T18:25:40Z\",\n            \"updated_at\": \"2016-07-12T18:25:40Z\",\n        }\n    ],\n    \"status\": \"active\",\n    \"created_at\": \"2016-07-12T18:25:40Z\",\n    \"updated_at\": \"2016-07-12T18:25:40Z\",\n    \"metadata\": {\n        \"id\": \"my_subscription_id\"\n    }\n}"
                OK (with boleto):
                  value: "{\n    \"id\": \"sub_bpYjMr9f8sA6QJNg\",\n    \"code\": \"XPLMBV9U10\",\n    \"start_at\": \"2018-04-04T00:00:00Z\",\n    \"interval\": \"month\",\n    \"interval_count\": 1,\n    \"billing_type\": \"postpaid\",\n    \"current_cycle\": {\n        \"id\": \"cycle_j6WnJ7ei1hW68bXo\",\n        \"start_at\": \"2018-04-04T00:00:00Z\",\n        \"end_at\": \"2018-05-03T23:59:59Z\",\n        \"billing_at\": \"2018-05-04T00:00:00Z\"\n    },\n    \"next_billing_at\": \"2018-05-04T00:00:00Z\",\n    \"payment_method\": \"boleto\",\n    \"currency\": \"BRL\",\n    \"statement_descriptor\": \"Spotify\",\n    \"installments\": 1,\n    \"status\": \"active\",\n    \"created_at\": \"2018-04-04T21:36:13Z\",\n    \"updated_at\": \"2018-04-04T21:36:13Z\",\n    \"customer\": {\n        \"id\": \"cus_qr2AgDGiOhr61Y5L\",\n        \"name\": \"Tony Stark\",\n        \"email\": \"cc25e912-197c-4626-a85d-8c0597e9b157@avengers.com\",\n        \"delinquent\": false,\n        \"created_at\": \"2018-04-04T21:36:13Z\",\n        \"updated_at\": \"2018-04-04T21:36:13Z\",\n        \"phones\": {}\n    },\n    \"plan\": {\n        \"id\": \"plan_85AK5eF15feLKM4J\",\n        \"name\": \"Premium\",\n        \"description\": \"Vá de Premium. E seja feliz!\",\n        \"url\": \"/plans/plan_85AK5eF15feLKM4J/pagarme-teste/premium\",\n        \"statement_descriptor\": \"Spotify\",\n        \"interval\": \"month\",\n        \"interval_count\": 1,\n        \"billing_type\": \"postpaid\",\n        \"payment_methods\": [\n            \"boleto\",\n            \"credit_card\"\n        ],\n        \"installments\": [\n            1\n        ],\n        \"status\": \"active\",\n        \"currency\": \"BRL\",\n        \"created_at\": \"2018-04-04T21:36:09Z\",\n        \"updated_at\": \"2018-04-04T21:36:09Z\"\n    },\n    \"items\": [\n        {\n            \"id\": \"si_xGw3AeYiaTJ639A6\",\n            \"name\": \"Name - Premium\",\n            \"description\": \"Test - Description\",\n    