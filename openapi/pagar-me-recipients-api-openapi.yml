      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"re_clxnqkxk709sc019taqhmj4kf\",\n    \"name\": \"Antonio da Silva\",\n    \"email\": \"tstark@avengers.com\",\n    \"code\": \"21875b51-d4c3-46d3-aeee-d8b3112aab55\",\n    \"document\": \"26224451990\",\n    \"type\": \"individual\",\n    \"payment_mode\": \"bank_transfer\",\n    \"status\": \"active\",\n    \"created_at\": \"2024-06-20T20:50:31Z\",\n    \"updated_at\": \"2024-06-20T20:50:31Z\",\n    \"transfer_settings\": {\n        \"transfer_enabled\": true,\n        \"transfer_interval\": \"Weekly\",\n        \"transfer_day\": 1\n    },\n    \"default_bank_account\": {\n        \"id\": \"ba_LlpvMnqcXSO2EVW8\",\n        \"holder_name\": \"Tony Stark\",\n        \"holder_type\": \"individual\",\n        \"holder_document\": \"26224451990\",\n        \"bank\": \"341\",\n        \"branch_number\": \"1234\",\n        \"branch_check_digit\": \"6\",\n        \"account_number\": \"12345\",\n        \"account_check_digit\": \"6\",\n        \"type\": \"checking\",\n        \"status\": \"active\",\n        \"created_at\": \"2024-06-20T20:50:31Z\",\n        \"updated_at\": \"2024-06-20T20:50:31Z\",\n        \"metadata\": {\n            \"key\": \"value\"\n        }\n    },\n    \"gateway_recipients\": [\n        {\n            \"gateway\": \"pagarme\",\n            \"status\": \"active\",\n            \"pgid\": \"re_clxnqkxk709sc019taqhmj4kf\",\n            \"createdAt\": \"2024-06-20T20:50:31Z\",\n            \"updatedAt\": \"2024-06-20T20:50:31Z\"\n        }\n    ],\n    \"automatic_anticipation_settings\": {\n        \"enabled\": false,\n        \"type\": \"full\",\n        \"volume_percentage\": 0,\n        \"delay\": 365\n    },\n    \"metadata\": {\n        \"key\": \"value\"\n    },\n    \"register_information\": {\n        \"email\": \"tstark@avengers.com\",\n        \"document\": \"26224451990\",\n        \"type\": \"individual\",\n        \"site_url\": \"http://www.site.com\",\n        \"phone_numbers\": [\n            {\