openapi: 3.2.0
info:
  title: pagarme-api Recipients API
  version: '5'
servers:
- url: https://api.pagar.me/core/v5
security:
- sec0: []
tags:
- name: Recipients
paths:
  /recipients:
    post:
      summary: Criar recebedor
      description: Rota para criar um recebedor, definindo os dados do recebedor, transferência e qual a conta bancária que será utilizada para envio dos pagamentos.
      operationId: criar-recebedor-1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - register_information
              - default_bank_account
              properties:
                code:
                  type: string
                  description: Referencia externa única por recebedor
                register_information:
                  type: object
                  description: Dados cadastrais do recebedor. O objeto deve ser preenchido de acordo com o tipo do recebedor, Pessoa Física [PF] ou Pessoa Jurídica [PJ].
                  required:
                  - email
                  - document
                  - type
                  - company_name
                  - trading_name
                  - annual_revenue
                  - name
                  - birthdate
                  - monthly_income
                  - professional_occupation
                  properties:
                    email:
                      type: string
                      description: '[PF/PJ] E-mail do recebedor.'
                    document:
                      type: string
                      description: '[PF/PJ] Número do documento. Recebedores Pessoa Física preencherão o CPF e os recebedores Pessoa Jurídica preencherão o CNPJ.'
                    type:
                      type: string
                      description: '[PF/PJ] Para recebedores Pessoa Física, utilizar ''individual'' e para recebedores Pessoa Jurídica, utilizar ''corporation''.'
                    site_url:
                      type: string
                      description: '[PF/PJ] Site do recebedor. Observação: É necessário incluir o protocolo Http ou Https.'
                    phone_numbers:
                      type: object
                      description: '[PJ] Telefone do recebedor.'
                      required:
                      - ddd
                      - number
                      properties:
                        ddd:
                          type: string
                          description: DDD (Discagem Direta à Distância)
                        number:
                          type: string
                          description: Número do telefone
                        type:
                          type: string
                          description: Tipo do telefone
                    company_name:
                      type: string
                      description: '[PJ] Nome fantasia do recebedor. Campo exclusivo para recebedores Pessoa Jurídica.'
                    trading_name:
                      type: string
                      description: '[PJ] Razão social da empresa. Campo exclusivo para recebedores Pessoa Jurídica.'
                    annual_revenue:
                      type: integer
                      description: '[PJ] Receita anual da empresa. Campo exclusivo para recebedores Pessoa Jurídica.'
                      format: int32
                    corporation_type:
                      type: string
                      description: '[PJ] Tipo da empresa. Campo exclusivo para recebedores Pessoa Jurídica.'
                    founding_date:
                      type: string
                      description: '[PJ] Data de fundação da empresa. Campo exclusivo para recebedores Pessoa Jurídica.'
                    main_address:
                      type: object
                      description: '[PJ] Endereço da empresa. Campo exclusivo para recebedores Pessoa Jurídica.'
                      required:
                      - street
                      - complementary
                      - street_number
                      - neighborhood
                      - city
                      - state
                      - zip_code
                      - reference_point
                      properties:
                        street:
                          type: string
                          description: Rua
                        complementary:
                          type: string
                          description: Complemento
                        street_number:
                          type: string
                          description: Número
                        neighborhood:
                          type: string
                          description: Bairro
                        city:
                          type: string
                          description: Cidade
                        state:
                          type: string
                          description: Estado
                        zip_code:
                          type: string
                          description: CEP. Para endereço brasileiro, deve conter uma numeração de 8 dígitos
                        reference_point:
                          type: string
                          description: Ponto de referência do endereço
                    managing_partners:
                      type: array
                      description: '[PJ] Representante legal atrelado a empresa. Campo exclusivo para recebedores Pessoa Jurídica.'
                      items:
                        properties:
                          name:
                            type: string
                            description: Nome do representante legal atrelado a empresa representada pelo recebedor
                          email:
                            type: string
                            description: E-mail do representante legal atrelado a empresa representada pelo recebedor
                          document:
                            type: string
                            description: Número do CPF do representante legal atrelado a empresa representada pelo recebedor
                          type:
                            type: string
                            description: Sempre será 'individual'
                          mother_name:
                            type: string
                            description: Nome da mãe do representante legal atrelado a empresa representada pelo recebedor
                          birthdate:
                            type: string
                            description: Aniversário do representante legal atrelado a empresa representada pelo recebedor
                          monthly_income:
                            type: string
                            description: 'Renda mensal média ou estimada declarada pelo representante legal atrelado a empresa representada pelo recebedor. Exemplo: de R$1.000,00 até R$2.000,00'
                          professional_occupation:
                            type: string
                            description: Ocupação profissional do representante legal atrelado a empresa representada pelo recebedor
                          self_declared_legal_representative:
                            type: boolean
                            description: Garantia de que aquele cadastro de pessoal física se identifica como representante legal do CNPJ do recebedor ao qual está atrelado
                          address:
                            type: object
                            required:
                            - street
                            - complementary
                            - street_number
                            - neighborhood
                            - city
                            - state
                            - zip_code
                            - reference_point
                            properties:
                              street:
                                type: string
                                description: Rua
                              complementary:
                                type: string
                                description: Complemento
                              street_number:
                                type: string
                                description: Número
                              neighborhood:
                                type: string
                                description: Bairro
                              city:
                                type: string
                                description: Cidade
                              state:
                                type: string
                                description: Estado
                              zip_code:
                                type: string
                                description: CEP. Para endereço brasileiro, deve conter uma numeração de 8 dígitos
                              reference_point:
                                type: string
                                description: Ponto de referência do endereço
                          phone_numbers:
                            type: array
                            items:
                              properties:
                                ddd:
                                  type: string
                                  description: DDD (Discagem Direta à Distância)
                                number:
                                  type: string
                                  description: Número do telefone
                                type:
                                  type: string
                                  description: Tipo do telefone
                              required:
                              - ddd
                              - number
                              type: object
                        required:
                        - name
                        - email
                        - document
                        - birthdate
                        - monthly_income
                        - professional_occupation
                        - self_declared_legal_representative
                        type: object
                    name:
                      type: string
                      description: '[PF] Nome do recebedor. Campo exclusivo para recebedores Pessoa Física.'
                    mother_name:
                      type: string
                      description: '[PF] Nome da mãe. Campo exclusivo para recebedores Pessoa Física.'
                    birthdate:
                      type: string
                      description: '[PF] Aniversário. Campo exclusivo para recebedores Pessoa Física.'
                    monthly_income:
                      type: integer
                      description: '[PF] Renda mensal. Campo exclusivo para recebedores Pessoa Física.'
                      format: int32
                    professional_occupation:
                      type: string
                      description: '[PF] Ocupação profissional. Campo exclusivo para recebedores Pessoa Física.'
                    address:
                      type: object
                      description: '[PF] Endereço do recebedor.'
                      required:
                      - street
                      - complementary
                      - street_number
                      - neighborhood
                      - city
                      - state
                      - zip_code
                      - reference_point
                      properties:
                        street:
                          type: string
                          description: Rua
                        complementary:
                          type: string
                          description: Complemento
                        street_number:
                          type: string
                          description: Número
                        neighborhood:
                          type: string
                          description: Bairro
                        city:
                          type: string
                          description: Cidade
                        state:
                          type: string
                          description: Estado
                        zip_code:
                          type: string
                          description: CEP. Para endereço brasileiro, deve conter uma numeração de 8 dígitos
                        reference_point:
                          type: string
                          description: Ponto de referência do endereço
                default_bank_account:
                  type: object
                  description: Dados da conta bancária do recebedor.
                  required:
                  - holder_name
                  - holder_type
                  - holder_document
                  - bank
                  - branch_number
                  - account_number
                  - account_check_digit
                  - type
                  properties:
                    holder_name:
                      type: string
                      description: Nome do titular da conta.
                    holder_type:
                      type: string
                      description: Tipo de titular. Valores possíveis são **individual** (pessoa física) ou **company** (pessoa jurídica).
                    holder_document:
                      type: string
                      description: Número do documento do titular da conta. Deve ser igual ao documento do recebedor.
                    bank:
                      type: string
                      description: Código do banco.
                    branch_number:
                      type: string
                      description: Número da agência.
                    branch_check_digit:
                      type: string
                      description: Código verificador da agência.
                    account_number:
                      type: string
                      description: Número da conta. Máximo 13 caracteres numéricos
                    account_check_digit:
                      type: string
                      description: Código verificador da conta.
                    type:
                      type: string
                      description: Tipo da conta. Valores possíveis são **checking** ou **savings**.
                    metadata:
                      type: object
                      description: Objeto chave/valor utilizado para armazenar informações adicionais sobre a conta bancária.
                      properties: {}
                transfer_settings:
                  type: object
                  description: Informações de transferência do recebedor
                  properties:
                    transfer_enabled:
                      type: boolean
                      description: _Indica se o recebedor receberá seus pagamentos automaticamente `.
                    transfer_interval:
                      type: string
                      description: Indica a frequência das transferências automáticas para a conta do recebedor.
                    transfer_day:
                      type: integer
                      description: Indica o dia em que ocorrerá as transferências automáticas.
                      format: int32
                automatic_anticipation_settings:
                  type: object
                  description: Informações de antecipação automática do recebedor
                  properties:
                    enabled:
                      type: boolean
                      description: Indica se o recebedor receberá antecipações automaticamente
                    type:
                      type: string
                      description: ndica o tipo de antecipação automática que será configurado para a conta do recebedor. Valores possíveis **full** e **1025**.
                    volume_percentage:
                      type: string
                      description: Indica o volume passível de ser antecipado para o recebedor.
                    days:
                      type: array
                      description: Indica os dias em que ocorrerá as antecipações automáticas.
                      items:
                        type: string
                    delay:
                      type: string
                      description: Indica a quantidade de dias que serão desconsiderados na contabilização do valor passível de ser antecipado. A contagem de dias é realizada a partir do dia da antecipação para trás
                metadata:
                  type: string
                  description: Objeto chave/valor utilizado para armazenar informações adicionais sobre o recebedor.
            examples:
              Request Pessoa Jurídica:
                value:
                  code: '1234'
                  register_information:
                    company_name: Recebedor pessoa juridica
                    trading_name: Empresa LTDA
                    email: empresax@avengers.com
                    document: '77699131000133'
                    type: corporation
                    site_url: http://www.site.com
