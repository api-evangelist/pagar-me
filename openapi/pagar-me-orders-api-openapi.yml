openapi: 3.2.0
info:
  title: pagarme-api Orders API
  version: '5'
servers:
- url: https://api.pagar.me/core/v5
security:
- sec0: []
tags:
- name: Orders
paths:
  /orders:
    post:
      summary: Criar pedido (com Antifraude)
      description: ''
      operationId: criar-pedido-com-split-1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              - payments
              properties:
                code:
                  type: string
                  description: 'Código identificador do pedido no sistema da loja. Max: 52 caracteres.'
                items:
                  type: array
                  description: Itens do pedido. [Saiba mais sobre itens do pedido](https://docs.pagar.me/reference/item-do-pedido-1)
                  items:
                    properties:
                      amount:
                        type: integer
                        description: Valor unitário. Obrigatoriamente maior que zero.
                        format: int32
                      description:
                        type: string
                        description: Descrição do item.
                      quantity:
                        type: integer
                        description: Quantidade de itens.
                        format: int32
                      code:
                        type: string
                        description: Código do item no sistema da loja.
                    required:
                    - code
                    type: object
                customer_id:
                  type: string
                  description: Código do cliente.
                customer:
                  type: object
                  description: Dados do cliente. Obrigatório caso o **customer_id** não seja informado. [Saiba mais sobre clientes](https://docs.pagar.me/reference/clientes-1)
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: 'Nome do cliente. Max: 64 caracteres.'
                    type:
                      type: string
                      description: 'Tipo de cliente. Valores possíveis: individual (pessoa física) ou company (pessoa jurídica). Obrigatório, caso o document seja enviado.'
                    email:
                      type: string
                      description: 'E-mail do cliente. Max: 64 caracteres.'
                    code:
                      type: string
                      description: 'Código de referência do cliente no sistema da loja. Max: 52 caracteres.'
                    document:
                      type: string
                      description: 'CPF, CNPJ ou PASSAPORTE do cliente. Max: 16 caracteres para CPF e CNPJ e Max: 50 caracteres para PASSAPORTE.'
                    document_type:
                      type: string
                      description: 'Tipo de documento. Valores possíveis: "CPF", "CNPJ" ou "PASSPORT".'
                    gender:
                      type: string
                      description: 'Sexo do cliente . Valores possíveis: male ou female.'
                    address:
                      type: object
                      description: Endereço do cliente.
                      properties:
                        country:
                          type: string
                          description: País (Código do país no formato ISO 3166-1 alpha-2)(2 digitos)
                        state:
                          type: string
                          description: Estado (Código do estado no formato ISO 3166-2).
                        city:
                          type: string
                          description: Cidade.
                        zip_code:
                          type: string
                          description: Código Postal (CEP) (Apenas numérico).
                        line_1:
                          type: string
                          description: Dados principais do endereço. Neste campo deve ser informado Número, Rua, Bairro, nesta ordem e separados por vírgula.
                        line_2:
                          type: string
                          description: Dados complementares do endereço. Neste campo pode ser informado complemento, referências.
                    phones:
                      type: object
                      description: Telefone residencial do cliente.
                      properties:
                        home_phone:
                          type: object
                          description: Telefone residencial do cliente.
                          properties:
                            country_code:
                              type: string
                              description: Código do País (Apenas numérico).
                            area_code:
                              type: string
                              description: Código da área (Apenas numérico).
                            number:
                              type: string
                              description: Número do telefone (Apenas numérico).
                        mobile_phone:
                          type: object
                          description: Telefone celular do cliente.
                          properties:
                            country_code:
                              type: string
                              description: Código do País (Apenas numérico).
                            area_code:
                              type: string
                              description: Código da área (Apenas numérico).
                            number:
                              type: string
                              description: Número do telefone (Apenas numérico).
                    birthdate:
                      type: string
                      description: Data de nascimento do cliente.
                      format: date
                    metadata:
                      type: string
                      description: Objeto chave/valor utilizado para armazenar informações adicionais sobre o cliente.
                shipping:
                  type: object
                  description: Dados para entrega.
                  properties:
                    amount:
                      type: integer
                      description: Valor da entrega.
                      format: int32
                    description:
                      type: string
                      description: Descrição da entrega.
                    recipient_name:
                      type: string
                      description: Destinatário da entrega.
                    recipient_phone:
                      type: string
                      description: Telefone do destinatário.
                    address:
                      type: object
                      description: Endereço de entrega
                      properties:
                        country:
                          type: string
                          description: País (Código do país no formato ISO 3166-1 alpha-2)(2 digitos)
                        state:
                          type: string
                          description: Estado (Código do estado no formato ISO 3166-2).
                        city:
                          type: string
                          description: Cidade.
                        zip_code:
                          type: string
                          description: Código Postal (CEP) (Apenas numérico).
                        line_1:
                          type: string
                          description: Dados principais do endereço. Neste campo deve ser informado Número, Rua, Bairro, nesta ordem e separados por vírgula.
                        line_2:
                          type: string
                          description: Dados complementares do endereço. Neste campo pode ser informado complemento, referências.
                payments:
                  type: array
                  description: Lista de dados de pagamento. [Saiba mais sobre pagamentos.](https://docs.pagar.me/reference/vis%C3%A3o-geral-sobre-pagamento)
                  items:
                    properties:
                      payment_method:
                        type: string
                        description: 'Meio de pagamento. Valores possíveis: credit_card, boleto, Pix, Debit Card'
                      credit_card:
                        type: object
                        description: Dados sobre o pagamento com cartão de crédito (obrigatório caso o payment_method seja credit_card).
                        properties:
                          operation_type:
                            type: string
                            description: Indica se a transação deve ser capturada "auth_and_capture", autorizada "auth_only", ou pré autorizada "pre_auth".
                          installments:
                            type: integer
                            description: Quantidade de parcelas. Se a transação for uma recorrência, o número de parcelas deverá ser 1.
                            format: int32
                          statement_descriptor:
                            type: string
                            description: 'Texto exibido na fatura do cartão. Max: 22 caracteres para clientes Gateway; 13 para clientes PSP'
                          card:
                            type: object
                            description: Cartão de crédito.
                            required:
                            - number
                            - holder_name
                            - exp_month
                            - exp_year
                            properties:
                              number:
                                type: string
                                description: Número do cartão. Entre 13 e 19 caracteres
                              holder_name:
                                type: string
                                description: Nome do portador como está impresso no cartão. Máximo de 64 caracteres (Caracteres especiais e números não são aceitos)
                              holder_document:
                                type: string
                                description: CPF ou CNPJ do portador do cartão. Obrigatório caso o tipo do cartão seja voucher (bandeiras VR ou Pluxee).
                              exp_month:
                                type: integer
                                description: Mês de validade do cartão. Valor entre 1 e 12 (inclusive)
                                format: int32
                              exp_year:
                                type: integer
                                description: 'Ano de validade do cartão. Formatos yy ou yyyy. Ex: 23 ou 2023.'
                                format: int32
                              cvv:
                                type: string
                                description: Código de segurança do cartão. O campo aceita 4 ou 3 caracteres, variando por bandeira.
                              brand:
                                type: string
                                description: '(Opcional) Bandeira do cartão. Para cartões de crédito, temos como valores possíveis: Elo, Mastercard, Visa, Amex, ou Hipercard. Para voucher, temos como valores possíveis: Alelo, Ticket, VR ou Pluxee.'
                              label:
                                type: string
                                description: Indica a label do cartão
                              billing_address_id:
                                type: string
                                description: 'Código do endereço de cobrança. Max: 36 caracteres.<>Opcional, pode ser utilizado no lugar do billing_address.'
                              billing_address:
                                type: object
                                properties:
                                  line_1:
                                    type: string
                                    description: 'Linha 1 do endereço. (Número, Rua, e Bairro - Nesta ordem e separados por vírgula) Max: 256 caracteres.'
                                  line_2:
                                    type: string
                                    description: 'Linha 2 do endereço. (Complemento - Andar, Sala, Apto). Max: 128 caracteres.'
                                  zip_code:
                                    type: string
                                    description: 'CEP. Max: 16 caracteres.'
                                  city:
                                    type: string
                                    description: 'Cidade. Max: 64 caracteres.'
                                  state:
                                    type: string
                                    description: Código do estado no formato ISO 3166-2.
                                  country:
                                    type: string
                                    description: Código do país no formato ISO 3166-1 alpha-2.
                          network_token:
                            type: object
                            description: Token de bandeira.
                            properties:
                              number:
                                type: string
                                description: 'Número do Network Token. Entre 13 e 19 caracteres. Ex: 4190000000000069'
                              holder_name:
                                type: string
                                description: Nome do portador como está impresso no cartão. Máximo de 64 caracteres (Caracteres especiais e números não são aceitos)
                              exp_month:
                                type: integer
                                description: Mês de validade do Network Token. Valor entre 1 e 12 (inclusive)
                                format: int32
                              exp_year:
                                type: integer
                                description: 'Ano de validade do Network Token. Formatos yy ou yyyy. Ex: 23 ou 2023.'
                                format: int32
                              cryptograms:
                                type: string
                                description: 'Criptograma de autenticação para Network Token. Pode enviar mais de um, caso queira em uma lista de strings. Formato em base64. Ex: ANfQt43bddROAAEnSAMhAAADFA===='
                          card_id:
                            type: string
                            description: identificador do cartão de um cliente.
                          card_token:
                            type: string
                            description: token do cartão gerado pelo checkout transparente
                          recurrence_cycle:
                            type: string
                            description: 'Informa se o pedido é referente a uma recorrência externa.  Possíveis valores: `first` ou `subsequent`.'
                          initiated_type:
                            type: string
                            description: 'Identificador do tipo de transação avulsa. Valores possíveis: `partial_shipment` (Remessa Parcial), `related_or_delayed_charge` (Cobrança Atrasada), `no_show` (Multa) ou `retry` (Retentativa). Valores possíveis: `standing_order` (Ordem Permanente), `instalment` (Parcelamento) ou `subscription` (Assinatura convencional com valor e frequência fixa). [Mais detalhes](https://docs.pagar.me/page/mitcit-transa%C3%A7%C3%B5es-card-on-file-mastercard).'
                          recurrence_model:
                            type: string
                            description: 'Identificador do tipo de recorrência. Valores possíveis: `standing_order` (Ordem Permanente), `instalment` (Parcelamento) ou `subscription` (Assinatura convencional com valor e frequência fixa). Valores possíveis: `standing_order` (Ordem Permanente), `instalment` (Parcelamento) ou `subscription` (Assinatura convencional com valor e frequência fixa). [Mais detalhes](https://docs.pagar.me/page/mitcit-transa%C3%A7%C3%B5es-card-on-file-mastercard).'
                          payment_origin:
                            type: object
                            description: Identificador da primeira cobrança de uma recorrência. [Mais detalhes](https://docs.pagar.me/docs/api-v5-identificador-de-recorr%C3%AAncia-para-assinaturas-externas).
                            properties:
                              charge_id:
                                type: string
                                description: Identificador da cobrança
                              brand_id:
                                type: string
                                description: Identificador da bandeira
                      boleto:
                        type: object
                        description: Dados sobre o pagamento com boleto (obrigatório caso o payment_method seja boleto).
                        properties:
                          bank:
                            type: string
                            description: Código do banco. 001 (Banco do Brasil); 033 (Santander); 237 (Bradesco); 341 (Itau); 745 (Citibank) e 104 (Caixa Econômica Federal).
                          instructions:
                            type: string
                            description: 'Instruções do boleto. Max: 256 caracteres.'
                          due_at:
                            type: string
                            description: Data de vencimento. (Opcional)
                          nosso_numero:
                            type: string
                            description: Número que identifica unicamente um boleto para uma conta.
                          type:
                            type: string
                            description: Tipo de espécie do boleto.DM (Duplicata Mercantil) e BDP (Boleto de proposta)
                          document_number:
                            type: string
                            description: 'Identificador do boleto. Max: 16 caracteres.'
                          interest:
                            type: object
                            description: Aplicação do juros sobre o boleto.
                            required:
                            - days
                            - type
                            - amount
                            properties:
                              days:
                                type: integer
                                description: Dias após a expiração do boleto quando o juros deve ser cobrado.
                                format: int32
                              type:
                                type: string
                                description: Tipo de divisão. Os valores possíveis são flat ou percentage.
                              amount:
                                type: string
                                description: Valor em porcentagem ou em centavos da taxa de juros que será cobrada ao mês.
                          fine:
                            type: object
                            description: Aplicação da multa sobre o boleto.
                            required:
                            - days
                            - type
                            - amount
                            properties:
                              days:
                                type: integer
                                description: Dias após a expiração do boleto quando a multa deve ser cobrada.
                                format: int32
                              type:
                                type: string
                                description: Tipo de divisão. Os valores possíveis são flat ou percentage.
                              amount:
                                type: integer
                                description: Valor em porcentagem ou em centavos que será cobrada na multa.
                                format: int32
                          discount:
                            type: object
                            description: Objeto raiz de desconto por antecipação. Exclusivo PSP.
                            properties:
                              type:
                                type: string
                                description: 'Tipo do desconto: "percentage" (% sobre o total) ou "flat" (centavos). Aplica-se a todas as regras do array.'
                              rules:
                                type: array
                                description: Lista de regras de desconto ordenadas por limit_date crescente.
                                items:
                                  properties:
                                    limit_date:
                                      type: string
                                      description: Data limite da regra. Formato YYYY-MM-DD. Deve ser anterior ao due_at do boleto.
                                    amount:
                                      type: integer
                                      description: 'Valor do desconto. Se type: percentage: entre 0.01 e 100 (ex: 15.00 = 15%). Se type: flat: inteiro em centavos, mín. 1 (ex: 500 = R$5,00).'
                                      format: int32
                                  type: object
                      debit_card:
                        type: object
                        description: Dados sobre o pagamento com cartão de débito (obrigatório caso o payment_method seja debit_card).
                        properties:
                          statement_descriptor:
                            type: string
                            description: 'Texto exibido na fatura do cartão. Max: 22 caracteres.'
                          card:
                            type: object
                            required:
                            - number
                            - holder_name
                            - exp_month
                            - exp_year
                            properties:
                              number:
                                type: string
                                description: Número do cartão. Entre 13 e 19 caracteres
                              holder_name:
                                type: string
                                description: Nome do portador como está impresso no cartão. Máximo de 64 caracteres (Caracteres especiais e números não são aceitos)
                              holder_document:
                                type: string
                                description: CPF ou CNPJ do portador do cartão. Obrigatório caso o tipo do cartão seja voucher (bandeiras VR ou Pluxee).
                              exp_month:
                                type: integer
                                description: Mês de validade do cartão. Valor entre 1 e 12 (inclusive)
                                format: int32
                              exp_year:
                                type: integer
                                description: 'Ano de validade do cartão. Formatos yy ou yyyy. Ex: 23 ou 2023.'
                                format: int32
                              cvv:
                                type: string
                                description: Código de segurança do cartão. O campo aceita 4 ou 3 caracteres, variando por bandeira.
                              brand:
                                type: string
                                description: '(Opcional) Bandeira do cartão. Para cartões de crédito, temos como valores possíveis: Elo, Mastercard, Visa, Amex, ou Hipercard. Para voucher, temos como valores possíveis: Alelo, Ticket, VR ou Pluxee.'
                              label:
                                type: string
                                description: Indica a label do cartão
                              billing_address_id:
                                type: string
                                description: 'Código do endereço de cobrança. Max: 36 caracteres.<>Opcional, pode ser utilizado no lugar do billing_address.'
                              billing_address:
                                type: object
                                properties:
                                  line_1:
                                    type: string
                                    description: 'Linha 1 do endereço. (Número, Rua, e Bairro - Nesta ordem e separados por vírgula) Max: 256 caracteres.'
                                  line_2:
                                    type: string
                                    description: 'Linha 2 do endereço. (Complemento - Andar, Sala, Apto). Max: 128 caracteres.'
                                  zip_code:
                                    type: string
                                    description: 'CEP. Max: 16 caracteres.'
                                  city:
                                    type: string
                                    description: 'Cidade. Max: 64 caracteres.'
                                  state:
                                    type: string
                                    description: Código do estado no formato ISO 3166-2.
                                  country:
                                    type: string
                                    description: Código do país no formato ISO 3166-1 alpha-2.
                          card_id:
                            type: string
                            description: identificador do cartão de um cliente.
                          card_token:
                            type: string
                            description: token do cartão gerado pelo checkout transparente
                          network_token:
                            type: object
                            description: Token de bandeira.
                            properties:
                              number:
                                type: string
                                description: 'Número do Network Token. Entre 13 e 19 caracteres. Ex: 4190000000000069'
                              holder_name:
                                type: string
                                description: Nome do portador como está impresso no cartão. Máximo de 64 caracteres (Caracteres especiais e números não são aceitos)
                              exp_month:
                                type: integer
                                description: Mês de validade do Network Token. Valor entre 1 e 12 (inclusive)
                                format: int32
                              exp_year:
                                type: integer
                                description: 'Ano de validade do Network Token. Formatos yy ou yyyy. Ex: 23 ou 2023.'
                                format: int32
                              cryptograms:
                                type: string
                                description: 'Criptograma de autenticação para Network Token. Pode enviar mais de um, caso queira em uma lista de strings. Formato em base64. Ex: ANfQt43bddROAAEnSAMhAAADFA===='
                          initiated_type:
                            type: string
                            description: 'Identificador do tipo de transação avulsa. Valores possíveis: `partial_shipment` (Remessa Parcial), `related_or_delayed_charge` (Cobrança Atrasada), `no_show` (Multa) ou `retry` (Retentativa).'
                          recurrence_model:
                            type: string
                            description: 'Identificador do tipo de recorrência. Valores possíveis: `standing_order` (Ordem Permanente), `instalment` (Parcelamento) ou `subscription` (Assinatura convencional com valor e frequência fixa).'
                      split:
                        type: array
                        description: Dados para o split de pagamentos.
                        items:
                          properties:
                            amount:
                              type: integer
                              description: Valor destinado ao recebedor.
                              format: int32
                            recipient_id:
                              type: string
                              description: 'Código do recebedor. Formato: rp_XXXXXXXXXXXXXXXX.'
                            type:
                              type: string
                              description: Tipo de divisão. Os valores possíveis são flat ou percentage.
                            options:
                              type: object
                              description: Informações da responsabilidade do recebedor na transação.
                              properties:
                                charge_processing_fee:
                                  type: boolean
                                  description: Indica se o recebedor vinculado à regra será cobrado pelas taxas da transação
                                charge_remainder_fee:
                                  type: boolean
                                  description: Indica se o recebedor vinculado à regra irá receber o restante dos recebíveis após uma divisão
                                liable:
                                  type: boolean
                                  description: Indica se o recebedor é responsável pela transação em caso de chargeback.
                          type: object
                    type: object
                closed:
                  type: boolean
                  description: Informa se o pedido será criado **aberto** ou **fechado**
                metadata:
                  type: string
                  description: Objeto chave/valor utilizado para armazenar informações adicionais sobre o pedido.
            examples:
              Request Example:
                value:
                  items:
                  - amount: 100
                    description: Chaveiro do Tesseract
                    quantity: 1
                    code: '12345'
                  customer:
                    name: Tony Stark
                    email: Tony@Avangers.com
                  payments:
                  - payment_method: credit_card
                    credit_card:
                      installments: 1
                      statement_descriptor: AVENGERS
                      card:
                        number: '342793631858229'
                        holder_name: Tony Stark
                        exp_month: 1
                        exp_year: 30
                        cvv: '3531'
                        billing_address:
                          line_1: 10880, Malibu Point, Malibu Central
                          zip_code: '90265'
                          city: Malibu
                          state: CA
                          country: US
                    split:
                    - amount: 50
                      recipient_id: rp_5yGwpMGckBHVYmb6
                      type: percentage
                      options:
                        charge_processing_fee: true
                        charge_remainder_fee: true
                        liable: true
                    - amount: 50
                      type: percentage
                      recipient_id: rp_yLnAyVpHbQIqZxwO
                      options:
                        charge_processing_fee: false
                        charge_remainder_fee: false
                        liable: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
